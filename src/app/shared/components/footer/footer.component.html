<footer>
  <!-- Toggle modo oscuro — esquina superior derecha del footer -->
  <button
    mat-icon-button
    class="theme-toggle"
    (click)="themeService.toggle()"
    [title]="themeService.isDark() ? 'Modo claro' : 'Modo oscuro'"
  >
    <mat-icon>{{
      themeService.isDark() ? "light_mode" : "dark_mode"
    }}</mat-icon>
  </button>

  <div class="footer-contenido">
    <!-- Título -->
    <div class="footer-titulo" routerLink="/">
      <img src="logo.png" class="footer-img" />
      <span class="app-text">
        <span><span class="inicial">P</span>araíso</span>
        <span><span class="inicial">P</span>ara</span>
        <span><span class="inicial">S</span>aborear</span>
      </span>
    </div>

    <!-- Columnas -->
    <div class="footer-columnas">
      <div class="columna">
        <h3>Explorar</h3>
        <a routerLink="/">Inicio</a>
        <a routerLink="/recetas">Recetas</a>
        <a routerLink="/categorias">Categorías</a>
        <a [routerLink]="['/']" fragment="preparaciones">Preparaciones</a>
        <a [routerLink]="['/']" fragment="salsas">Salsas</a>
        <a [routerLink]="['/']" fragment="trucos">Trucos</a>
      </div>
      <div class="columna">
        <h3>Más</h3>
        <a routerLink="/varios">Varios</a>
        <a routerLink="/glosario">Glosario</a>
        <a routerLink="/sobre-mi">Sobre mí</a>
      </div>
      <div class="columna">
        <h3>Sobre PPS</h3>
        <a routerLink="/admin">Administración</a>
        <a routerLink="/politica-privacidad">Política de privacidad</a>
        <a routerLink="/aviso-legal">Aviso legal</a>
      </div>
    </div>
  </div>

  <!-- Copyright -->
  <div class="footer-copyright">
    <!-- <a href="https://www.flaticon.com/free-icons/feast" title="feast icons"
      >Feast icons created by Bamicon - Flaticon</a
    > -->
    <span
      >© {{ currentYear }} Paraíso Para Saborear. Todos los derechos
      reservados.</span
    >
  </div>

  <!-- Ancho de ventana -->
  <div class="ancho-pantalla">{{ anchoVentana }}px</div>
</footer>
