<div
  @slideInUp
  class="modal-contenido"
  [class.truco]="data.tipo === 'truco'"
  [class.salsa]="data.tipo === 'salsa'"
>
  <button mat-icon-button class="cerrar" (click)="dialogRef.close()">
    <mat-icon>close</mat-icon>
  </button>

  <!-- MODO RECETA -->
  <ng-container *ngIf="data.tipo !== 'truco' && data.tipo !== 'salsa'">
    <img
      [src]="data.foto || 'assets/images/placeholder.webp'"
      [alt]="data.nombre"
      class="foto"
      (error)="$any($event.target).src = 'assets/images/placeholder.webp'"
    />
    <div class="info">
      <p class="categoria">{{ data.categoria }}</p>
      <h2>{{ data.nombre }}</h2>
      <div class="meta">
        <span
          ><mat-icon>schedule</mat-icon> {{ data.tiempoPreparacion }}
          {{ data.tiempoUnidad }}</span
        >
        <span
          ><mat-icon>people</mat-icon> {{ data.comensales }}
          {{ data.comensales === 1 ? "persona" : "personas" }}</span
        >
        <span>
          <mat-icon [class]="'icono-' + data.dificultad.toLowerCase()"
            >signal_cellular_alt</mat-icon
          >
          {{ data.dificultad }}
        </span>
      </div>
    </div>
    <mat-dialog-actions align="center">
      <button
        mat-raised-button
        class="primary-btn"
        [routerLink]="['/recetas', data.id]"
        (click)="dialogRef.close()"
      >
        Ver receta completa
      </button>
    </mat-dialog-actions>
  </ng-container>

  <!-- MODO TRUCO -->
  <ng-container *ngIf="data.tipo === 'truco'">
    <div class="truco-header">
      <span class="truco-icono">{{ data.icono }}</span>
    </div>
    <div class="info">
      <h2>{{ data.nombre }}</h2>
      <p class="truco-descripcion" [innerHTML]="data.descripcion"></p>
    </div>
    <mat-dialog-actions align="center">
      <button mat-raised-button class="primary-btn" (click)="dialogRef.close()">
        Cerrar
      </button>
    </mat-dialog-actions>
  </ng-container>

  <!-- MODO SALSA -->
  <ng-container *ngIf="data.tipo === 'salsa'">
    <div class="info">
      <h2>{{ data.nombre }}</h2>
      <p class="truco-descripcion" [innerHTML]="data.descripcion"></p>
    </div>
    <mat-dialog-actions align="center">
      <button mat-raised-button class="primary-btn" (click)="dialogRef.close()">
        Cerrar
      </button>
    </mat-dialog-actions>
  </ng-container>
</div>
