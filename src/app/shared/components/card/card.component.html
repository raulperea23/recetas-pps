<mat-card [@fadeInUp] [routerLink]="['/recetas', receta.id]" class="tarjeta">
  @if (receta.destacada === true) {
    <span class="destacada-icon"><mat-icon>star</mat-icon></span>
  }
  <img
    mat-card-image
    [src]="receta.foto || 'assets/images/placeholder.png'"
    [alt]="receta.nombre"
    (error)="$any($event.target).src = 'assets/images/placeholder.png'"
  />
  <mat-card-content>
    <h3 class="card-title">{{ receta.nombre }}</h3>
    <p class="tipo-de-plato">{{ receta.tipoDePlato }}</p>
    <p class="categoria">{{ receta.categoria }}</p>
    <div class="info-card">
      <mat-icon>access_alarm</mat-icon>
      <span>{{ receta.tiempoPreparacion }} {{ receta.tiempoUnidad }}</span>
    </div>
    <div class="info-card">
      <mat-icon>person_outline</mat-icon>
      <span>{{ receta.comensales }} personas</span>
    </div>
    <div class="info-card">
      <mat-icon [class]="'icono-' + receta.dificultad.toLowerCase()"
        >signal_cellular_alt</mat-icon
      >
      <span>{{ receta.dificultad }}</span>
    </div>
  </mat-card-content>
</mat-card>
