<div class="section-header">
  <mat-icon class="section-icon">category</mat-icon>
  <span class="section-title">Categorías</span>
</div>
<p class="subtitle">Explora nuestras recetas por categoría</p>

<section class="grid">
  <div
    *ngFor="let cat of categorias"
    class="categoria-card"
    [routerLink]="['/categorias', cat.nombre]"
    [style.backgroundImage]="'url(' + cat.imagen + ')'"
  >
    <div class="overlay">
      <h2>{{ cat.nombre }}</h2>
    </div>
  </div>
</section>
